<!DOCTYPE html>
    <html>
        <head>
            <title>JavaScript - Ejercicio 7</title>
            <meta charset="UTF-8">
            <link rel="stylesheet" href="JS-7.css">
        </head>
        <body>
            <h1>Componentes de computadora</h1>
            <p>
                Procesador:
                <select id = "procesador">
                    <option>Sin elegir</option>
                    <option value = 1>Intel I3</option>
                    <option value = 2>Intel I5</option>
                    <option value = 3>Intel I7</option>
                </select>
                &nbsp;&nbsp;&nbsp;&nbsp;
                Precio del ítem:
                <input type = "text" class = "precioItem" id = "precioProcesador" placeholder = "Aquí se verá el precio del procesador elegido." readonly>
                <br>
                <br>
                Monitor:
                <select id = "monitor">
                    <option>Sin elegir</option>
                    <option value = 1>Samsung 20'</option>
                    <option value = 2>Samsung 22'</option>
                    <option value = 3>Samsung 26'</option>
                </select>
                &nbsp;&nbsp;&nbsp;&nbsp;
                Precio del ítem:
                <input type = "text" class = "precioItem" id = "precioMonitor" placeholder = "Aquí se verá el precio del monitor elegido." readonly>
                <br>
                <br>
                Disco duro:
                <select id = "discoDuro">
                    <option>Sin elegir</option>
                    <option value = 1>500 Gb</option>
                    <option value = 2>1 Tb</option>
                    <option value = 3>3 Tb</option>
                </select>
                &nbsp;&nbsp;&nbsp;&nbsp;
                Precio del ítem:
                <input type = "text" class = "precioItem" id = "precioDiscoDuro" placeholder = "Aquí se verá el precio del disco duro elegido." readonly>
                <br>
                <br>
                Precio final:
                <button id = "calculadorDePrecio">Calcular</button>
                &nbsp;&nbsp;&nbsp;&nbsp;
                <input type = "text" id = "textoPrecio" placeholder = "Aquí se verá el precio final." readonly>
            </p>
            <script src = "JS-7.js"></script>
        </body>
    </html>
